# /etc/apache2/sites-available/001-next.cascade.coop.conf — same conventions as the
# other cascade.coop vhosts: Let's Encrypt in /etc/letsencrypt/live/<domain>/, issued
# with certbot webroot (/var/www/html). Issue the certificate BEFORE enabling this file
# (see the steps in the PR / README), otherwise Apache won't start.
# The "001-" prefix matters: cascade.coop.conf ends with a catch-all (*.cascade.coop)
# and Apache picks the first matching vhost in file order.
<VirtualHost *:80>
    ServerName next.cascade.coop
    Redirect / https://next.cascade.coop/
</VirtualHost>
<VirtualHost *:443>
    ServerName next.cascade.coop
    DocumentRoot /home/cascade/next.cascade.coop
    <Directory "/home/cascade/next.cascade.coop">
        AllowOverride FileInfo
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/next.cascade.coop/cert.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/next.cascade.coop/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/next.cascade.coop/fullchain.pem

    # /en -> /en/index.html without Apache's 301 to /en/ (avoids an extra hop).
    DirectorySlash Off
    RewriteEngine On
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}/index.html -f
    RewriteRule ^(.*?)/?$ $1/index.html [L]

    ErrorLog ${APACHE_LOG_DIR}/next.cascade.coop-error.log
    CustomLog ${APACHE_LOG_DIR}/next.cascade.coop-access.log combined
</VirtualHost>
